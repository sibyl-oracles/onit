[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onit"
version = "0.1.5a"
description = "An agent harness for task automation — terminal, web, and API, on a model server you control"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Rowel Atienza"},
]
keywords = ["agent", "llm", "mcp", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "rich",
    "requests",
    "pyyaml",
    "pydantic",
    "fastmcp",
    "fastapi",
    "openai",
    "beautifulsoup4",
    "python-dateutil",
    "geopy",
    "ddgs",
    "pypdf",
    "ollama",
    "urllib3",
    "PyMuPDF",
    "keyring",
]

[project.optional-dependencies]
search = [
    "python-docx",
    "openpyxl",
]
web = [
    "google-auth",
]
# Full-duplex speech-to-speech. Only the websocket client to the VoiceChat
# container is needed here — the model runs in that container, and audio
# capture/playback happens in the browser.
voice = [
    "aiohttp",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
# `onit --resume` shipped a NameError: `_dispatch_mode` read a bare global
# `OnIt`, and a module __getattr__ does not serve a global lookup.  The suite
# was green because the tests that reach that function patch it out.  F821
# finds this class of defect without running anything, so it runs in CI.
#
# Pinned, because ``ruff format --check`` is a gate: an unpinned ruff means the
# build can go red on a release nobody in this repo made.  Bump deliberately.
lint = [
    "ruff==0.16.1",
]
bench = [
    "inspect-ai>=0.3.0",
    "inspect-evals",
    "datasets",
    "huggingface-hub",
    "numpy",
    "scikit-learn",
]
# Every runtime extra, and nothing a contributor needs.  These five entries
# were the literal string "onit" -- a self-reference, not an extra -- so
# `pip install onit[all]` silently installed nothing beyond the base package.
# `test`, `lint` and `bench` stay out on purpose: asking for every *tool*
# should not drag in pytest, a pinned ruff, or the inspect-ai stack.
all = [
    "onit[search,web,voice]",
]

[project.scripts]
onit = "onit.cli:main"

[project.urls]
Homepage = "https://github.com/sibyl-oracles/onit"
Repository = "https://github.com/sibyl-oracles/onit"
Issues = "https://github.com/sibyl-oracles/onit/issues"

[tool.pytest.ini_options]
testpaths = ["onit/test"]
asyncio_mode = "auto"
# The suite is the gate, so it is also the place a coverage floor belongs.
# Kept here rather than in the workflow so a local `pytest` and CI measure the
# same tree the same way.
#
# 74, not 75: the product tree measures 75.3%, and a floor one good week away
# from the measurement turns every unrelated change into a red build.  The
# floor is a ratchet, not a target -- raise it as the number rises, and never
# lower it to make a build pass.
addopts = "--cov=onit --cov-report=term-missing --cov-fail-under=74"

[tool.coverage.run]
# The tests are in ``onit/test``, so ``--cov=onit`` measured them too: 21175 of
# 40229 statements were the suite covering itself at 99%, which lifted the
# reported total to 88% over a product tree that sits at 75%.  Omitting them
# makes the number mean "how much of the code the tests protect".
omit = [
    "onit/test/*",
]

[tool.setuptools.packages.find]
include = ["onit*"]

[tool.setuptools.package-data]
"onit" = [
    "mcp/prompts/prompt_templates/*.yaml",
    "configs/*.yaml",
    "ui/static/*",
    "ui/static/vendor/*",
]

[tool.ruff]
# F821 undefined name, F811 redefinition, F401 unused import: the three that
# catch a name that is read but never bound.  Everything else is left to the
# reviewer; the wider rule set reports ~1,300 findings on this tree and a lint
# step nobody can pass is a lint step nobody reads.
line-length = 100

[tool.ruff.lint]
select = ["F821", "F811", "F401"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onit"
version = "0.1.5a"
description = "An agent harness for task automation — terminal, web, and API, on a model server you control"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Rowel Atienza"},
]
keywords = ["agent", "llm", "mcp", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "rich",
    "requests",
    "pyyaml",
    "pydantic",
    "fastmcp",
    "fastapi",
    "openai",
    "beautifulsoup4",
    "python-dateutil",
    "geopy",
    "ddgs",
    "pypdf",
    "ollama",
    "urllib3",
    "PyMuPDF",
    "keyring",
]

[project.optional-dependencies]
search = [
    "python-docx",
    "openpyxl",
]
web = [
    "google-auth",
]
# Full-duplex speech-to-speech. Only the websocket client to the VoiceChat
# container is needed here — the model runs in that container, and audio
# capture/playback happens in the browser.
voice = [
    "aiohttp",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
# `onit --resume` shipped a NameError: `_dispatch_mode` read a bare global
# `OnIt`, and a module __getattr__ does not serve a global lookup.  The suite
# was green because the tests that reach that function patch it out.  F821
# finds this class of defect without running anything, so it runs in CI.
lint = [
    "ruff",
]
bench = [
    "inspect-ai>=0.3.0",
    "inspect-evals",
    "datasets",
    "huggingface-hub",
    "numpy",
    "scikit-learn",
]
all = [
    "onit[search]",
    "onit[web]",
    "onit[voice]",
    "onit[test]",
    "onit[bench]",
]

[project.scripts]
onit = "src.cli:main"

[project.urls]
Homepage = "https://github.com/sibyl-oracles/onit"
Repository = "https://github.com/sibyl-oracles/onit"
Issues = "https://github.com/sibyl-oracles/onit/issues"

[tool.pytest.ini_options]
testpaths = ["src/test"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src" = [
    "mcp/prompts/prompt_templates/*.yaml",
    "configs/*.yaml",
    "ui/static/*",
    "ui/static/vendor/*",
]

[tool.ruff]
# F821 undefined name, F811 redefinition, F401 unused import: the three that
# catch a name that is read but never bound.  Everything else is left to the
# reviewer; the wider rule set reports ~1,300 findings on this tree and a lint
# step nobody can pass is a lint step nobody reads.
line-length = 100

[tool.ruff.lint]
select = ["F821", "F811", "F401"]

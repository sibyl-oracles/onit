serving:
  # Set via env var ONIT_HOST or --host CLI flag
  # host: http://localhost:8000/v1
  # host_key: EMPTY  # API key. For OpenRouter set here or via OPENROUTER_API_KEY env var
  # model: auto-detected from endpoint. Set explicitly for OpenRouter.
  think: false
  # When think is on, also spend reasoning on the turns that only pick a tool.
  # A thinking model reasons in full before every tool-call JSON, so a loop of
  # N tool calls pays for N reasoning passes. Set false to keep thinking for
  # the opening turn, where the approach is decided, and drop it for the rest
  # of the loop — the final answer included. Latency for deliberation.
  # think_tool_turns: true
  # Max output tokens per response. 32768 fits any single answer and keeps the
  # context-compaction threshold healthy (~90%) on large-context models.
  max_tokens: 32768
  # max_context_tokens: 1048576  # model's context window; auto-detected from vLLM if unset
  # num_ctx: 32768  # Ollama only: context window (prompt+output). Ollama defaults this
  #                 # to 2048, which truncates long answers. Auto-sized from the model's
  #                 # native window (capped at max(max_tokens*2, 32768)) when unset.
  # host2: http://localhost:8001/v1  # second server for load balancing (or ONIT_HOST2)
  # model2:  # model on host2; auto-detected when unset
  # load_balancer: sticky  # sticky | round_robin | random | least_busy
  # Ollama endpoints only serve while no vLLM/OpenRouter endpoint is healthy.
  # Set false (or pass --no-ollama-fallback-only) to load-balance across them.
  # ollama_fallback_only: true
  #
  # ── Loop policy ──────────────────────────────────────────────────────────
  # Ceilings on the ways the agent loop can fail to terminate. Every one is
  # optional; the default shown is what applies when the key is absent.
  #
  # Total turns (one model call each) before the loop gives up and returns
  # whatever it has. -1 disables the cap. The other ceiling below keys on the
  # tool name *and* byte-identical arguments, so a model alternating between
  # calls that differ by a page number or a timestamp never trips it — this is
  # the ceiling that actually bounds such a run.
  # max_chat_iterations: 50
  # Identical tool calls (same name and same arguments) before bailing out.
  # max_repeated_tool_calls: 30
  # Retries for a transient API error, with exponential backoff.
  # max_api_retries: 3
  # Times to nudge a model that announces a plan but calls no tool.
  # max_planning_continuations: 2
  # Times to push past a content-free acknowledgment before accepting it.
  # max_ack_continuations: 2
  # Times to resume a final answer cut off by the output token budget. Each
  # resume grants another max_tokens, bounding a long answer at ~(N+1)*max_tokens.
  # max_final_continuations: 3
  #
  # ── Fact-checking the answer ──────────────────────────────────────────────
  # The answer streams to the user as it is written, then is checked against
  # the evidence the run gathered; a claim the evidence contradicts is
  # corrected and the answer is reissued with a one-line note saying what
  # changed. Answers with no checkable claim in them skip the check entirely,
  # so short replies cost nothing. Set false to hand back the draft unchecked.
  # verify_answers: true
  # How many rounds of read-only lookups the check may run for claims the
  # gathered evidence does not cover. 0 — the default — checks against that
  # evidence alone: one small call, no tool runs, and claims the evidence never
  # touched are left alone. Raise it to also chase uncovered claims, at a round
  # trip plus a tool run plus another verdict call apiece.
  # verify_max_tool_turns: 0

messages:
  safety_warning:  "Press 'Enter' key to stop all tasks."

# What the agent is allowed to change about itself. One ladder rather than a
# switch per feature, raised one rung at a time (see docs/SELF_IMPROVEMENT.md):
#   off       nothing is recorded, nothing is injected
#   observe   trajectories are recorded; nothing is injected   (default)
#   adapt     recalled episodes and the playbook are injected  (not yet built)
#   extend    validated skills are served as tools             (not yet built)
#   evolve    scaffold variants may be proposed                (not yet built)
#
# At `observe` every request is byte-for-byte what it would have been with this
# off; the only difference is a JSONL line per task under `path` recording what
# the run did — which tools ran, how they went, tokens per turn, retries.
# Override with ONIT_LEARN=off for a baseline run without editing this file.
learn:
  autonomy: observe
  path: "~/.onit/learned"
  # Store a digest of each tool call's arguments rather than the arguments.
  # Parameter *names* are kept either way; it is the values that carry file
  # paths, search queries and the occasional pasted credential.
  redact_tool_args: true

verbose: false
show_logs: false

theme: dark
session_path: "~/.onit/sessions"

# see template examples in the `src/mcp/prompts/prompt_templates` folder
template_path:

# Documents a research answer may open after local_search. Each one is a tool
# round trip whose result then rides along in every later prompt, so this is
# the dial between recall and how long an answer takes to arrive.
#
# Set to the number of documents a result page describes (MAX_DOCUMENT_SUMMARIES).
# A budget below that silently truncates the very list the prompt just told the
# model to reason about: the documents ranked last are the ones whose opening
# does not restate the query, which is exactly the case where the opening is a
# poor proxy for the contents — a scholarship named only in the tail of an
# admissions announcement was dropped this way.
max_documents: 6

# Prior task/response pairs replayed into every request. They are re-sent on
# each turn, so a long tail costs prompt tokens on all of them. The most recent
# few are replayed whole; older answers are cut to their opening, which keeps
# the thread of the conversation without re-sending every answer in full.
history_turns: 10

# Build the agent instruction by calling the prompt function directly instead of
# reaching PromptsMCPServer over the network. That server hosts one prompt and
# the prompt is a pure function in this package, so the connection, handshake
# and round trip in front of every task bought nothing. Set false if your
# PromptsMCPServer runs a customized prompt rather than the one shipped here.
prompt_in_process: true

# number of seconds before a request times out; -1 for no overall timeout.
# Even with -1, connection setup and streaming stalls (no chunk received for
# 300s) are bounded so a wedged server cannot hang the chat loop forever.
timeout: -1

# Web UI settings
web_title: "OnIt Chat"
web: false
web_port: 9000

# Full-duplex speech-to-speech (see docs/VOICE.md).
#
# Talks to an NVIDIA NemotronLabs VoiceChat container over its realtime
# WebSocket. That model hears, thinks and speaks end to end — OnIt adds no ASR,
# TTS or VAD. What OnIt adds is the tool registry: the voice model is given a
# three-tool facade whose centrepiece, ask_onit, runs the full agent loop.
#
# The container wants a GPU with ~66 GB free and takes minutes to load, so the
# microphone button stays hidden until /api/voice/health reports ready.
voice:
  enabled: false
  # Port 9100, not the container's own default of 9000 — that collides with
  # web_port above when both run on one host.
  url: "ws://localhost:9100/v1/realtime"
  # PCM16 mono, both directions. The server resamples to 16 kHz internally.
  sample_rate: 24000
  # Spoken the moment the model commits to a tool call, so a 20-second agent
  # run is not 20 seconds of silence.
  # on_hold_message: "Give me a moment while I look that up."
  # An answer is read aloud, not scrolled: past this many characters the spoken
  # form is cut at a sentence boundary. The full markdown still reaches the
  # transcript, links and generated files included.
  max_spoken_chars: 600
  # Seconds before a runaway ask_onit is cancelled and the call moves on.
  tool_timeout: 90
  # The model documents that it cannot be interrupted while a tool call is
  # outstanding, which is precisely the window an agent task occupies. With
  # this on, OnIt measures the microphone itself and cancels the task through
  # the same safety queue the stop button uses.
  barge_in: true
  # barge_in_rms: 900     # PCM16 level that counts as speech
  # barge_in_frames: 5    # consecutive ~80 ms frames above it (~400 ms)
  # The model can start turns with no user input and talk to itself; end the
  # call after this many in a row.
  max_unprompted_turns: 3

# Google OAuth2 Authentication (Full Redirect Flow)
# To set up Google OAuth2, follow these steps:
# 1. Go to https://console.cloud.google.com/
# 2. Create a new project or select an existing one
# 3. Enable the Google+ API
# 4. Go to "Credentials" and create an OAuth 2.0 Client ID
# 5. Set the application type to "Web application"
# 6. Add authorized redirect URIs:
#    - http://localhost:9000/auth/callback
#    - http://YOUR_SERVER_IP:9000/auth/callback
# 7. Copy BOTH the Client ID and Client Secret
#
# NOTE: Keep your credentials secure and do not commit them to version control!
web_google_client_id:
web_google_client_secret:

# Optional: Restrict access to specific email addresses or domains
# If not specified, any verified Google account can access the web UI
# Supports:
#   - Exact emails: "user1@allusers.com" allows specific email addresses
#   - Domain wildcards: "*@example.com" allows any email from example.com domain
# web_allowed_emails:
#     - "*@example.com"
#     - "user1@allusers.com"

mcp:
  # Override the host/IP in all MCP server URLs.
  # Set via --mcp-host CLI flag or here. E.g. mcp_host: 192.168.1.100
  # mcp_host:
  servers:
    - name: PromptsMCPServer
      description: Provides prompt templates for instruction generation
      url: http://127.0.0.1:18200/sse
      enabled: true

    - name: ToolsMCPServer
      description: Web search, bash commands, file operations, and document tools
      url: http://127.0.0.1:18201/sse
      enabled: true

    # External MCP servers using Streamable HTTP transport (URLs should NOT end in /sse)
    # - name: SandboxMCPServer
    #   description: Sandbox code execution server
    #   url: http://127.0.0.1:18202/mcp
    #   enabled: true

name: CI

on:
  push:
    branches:
  pull_request:
    branches:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test,web,lint]

      - name: Undefined names
        # F821 catches the class of bug that shipped `onit --resume` a
        # NameError: a name read but never bound.  It runs before the tests
        # because it needs none of their fixtures -- a bare global lookup is
        # exactly what a patched-out test cannot see.
        #
        # benchmarks/ and scripts/ are linted too: they are not on the test
        # path, so a lint gate that stops at onit/ cannot see them at all.
        run: ruff check onit/ benchmarks/ scripts/

      - name: Format check
        run: ruff format --check onit/ benchmarks/ scripts/

      - name: Run tests
        # --cov, the report format and the coverage floor live in
        # [tool.pytest.ini_options] addopts, so this command and a local
        # `pytest` measure the same tree the same way.  -v stays here: it is a
        # CI readability choice, not part of the gate.
        run: pytest onit/test/ -v --tb=short

      - name: Per-module coverage floors (MCP)
        # The suite-wide floor is a ratchet on the total, so one badly covered
        # module costs it almost nothing -- that is how web/search sat at 17%
        # while the build stayed green.  This reads the .coverage file the step
        # above wrote and fails if any MCP module fell below its own floor.
        run: python scripts/check_mcp_coverage.py

  benchmarks:
    # The bench extras are heavy (inspect-ai, datasets, numpy, scikit-learn)
    # and the tests are offline, so this runs once rather than on all three
    # interpreter versions -- enough to keep them from rotting unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test,web,lint,bench]

      - name: Run benchmark tests
        # testpaths is onit/test, so these are invisible to the step above.
        # They assert on the Inspect provider and the task builders, not on a
        # model, so they need no server and no Docker.
        run: pytest benchmarks/ -v --tb=short -p no:cacheprovider --no-cov

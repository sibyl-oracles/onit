name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test,web,lint]

      - name: Undefined names
        # F821 catches the class of bug that shipped `onit --resume` a
        # NameError: a name read but never bound.  It runs before the tests
        # because it needs none of their fixtures -- a bare global lookup is
        # exactly what a patched-out test cannot see.
        run: ruff check src/

      - name: Run tests
        run: pytest src/test/ -v --tb=short
